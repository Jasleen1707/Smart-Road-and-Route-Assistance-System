
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Road Assistance GPS</title>
</head>
<body>
    <h2>Smart Road Assistance</h2>
    <p id="status">Starting GPS tracking...</p>
    <p id="coordinates">Waiting for location...</p>
    <p id="accuracy"></p>

    <script>
        let lastSaved = "";

        function startTracking() {
            if (!navigator.geolocation) {
                document.getElementById("status").textContent =
                    "Geolocation is not supported by this browser.";
                return;
            }

            document.getElementById("status").textContent =
                "Requesting location permission...";

            navigator.geolocation.watchPosition(
                async function(position) {
                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;
                    const accuracy = position.coords.accuracy;

                    document.getElementById("status").textContent =
                        "GPS tracking active";

                    document.getElementById("coordinates").textContent =
                        "Latitude: " + latitude +
                        " | Longitude: " + longitude;

                    document.getElementById("accuracy").textContent =
                        "Estimated accuracy: " +
                        accuracy.toFixed(1) + " metres";

                    // Avoid rewriting the file if coordinates haven't changed.
                    const coordsKey = latitude + " " + longitude;
                    if (coordsKey === lastSaved) return;

                    try {
                        const response = await fetch("/save-location", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                latitude: latitude,
                                longitude: longitude
                            })
                        });

                        if (!response.ok) {
                            throw new Error("HTTP " + response.status);
                        }

                        lastSaved = coordsKey;

                        document.getElementById("status").textContent =
                            "GPS tracking active — coordinates saved.";

                    } catch (error) {
                        document.getElementById("status").textContent =
                            "Location found, but saving failed. Check server.py.";
                        console.error(error);
                    }
                },

                function(error) {
                    document.getElementById("status").textContent =
                        "GPS error: " + error.message;
                },

                {
                    enableHighAccuracy: true,
                    timeout: 20000,
                    maximumAge: 0
                }
            );
        }

        // Start tracking automatically when the page loads.
        window.addEventListener("load", startTracking);
    </script>
</body>
</html>
